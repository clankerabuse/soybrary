# config.toml - SDXL LoRA training args for kohya sd-scripts (sdxl_train_network.py).
# Passed via --config_file. The dataset is described separately in dataset.toml
# (generated by train_lora.sh) and passed via --dataset_config.
#
# Tuned for 1× A100 40GB. Goal: every generated image contains a soyjak.
# Extra objects/settings in the prompt are allowed; a soyjak-less image is not.
#
# Effective batch = train_batch_size × gradient_accumulation_steps = 4 × 4 = 16.
# Step math: ~105,495 images / effective batch 16 = ~6,593 steps per epoch.
# Style lock needs more than one epoch; we train ~2.7 epochs (18k steps).
#
# IMPORTANT: train_batch_size must match BATCH_SIZE in train_lora.sh (which
# writes the same value into dataset.toml). gradient_accumulation_steps must
# match GRAD_ACCUM_STEPS there. If you change batch/accum, update steps + LR.

# --- base model ---
# Use the fp16 fixed-VAE SDXL base to avoid NaN VAE issues.
pretrained_model_name_or_path = "/home/ubuntu/models/sd_xl_base_1.0_fixvae_fp16.safetensors"
# VAE is baked into the fixed checkpoint. Do not set `vae = ""`; sd-scripts
# treats an empty string as a model id/path and crashes.

# --- output ---
output_dir = "/home/ubuntu/out"
output_name = "soyjak-lora-sdxl-v2"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_steps = 1500
save_last_n_steps = 6000

# --- LoRA network ---
network_module = "networks.lora"
network_dim = 64               # more capacity so the soyjak subject can overpower SDXL's prior
network_alpha = 64             # alpha=dim → full LoRA scale at weight 1.0

# --- precision / memory (1× A100 40GB) ---
mixed_precision = "bf16"
full_bf16 = true
gradient_checkpointing = true
sdpa = true                    # use torch SDPA attention (no xformers needed)
cache_latents = true
cache_latents_to_disk = true
persistent_data_loader_workers = true
max_data_loader_n_workers = 8

# --- optimizer / schedule ---
# LR scaled up for the 4× larger effective batch (4 → 16). Using a moderate
# sqrt-style bump (1e-4 → 1.5e-4) rather than full linear (4e-4) to stay stable.
optimizer_type = "AdamW8bit"   # fits A100 40GB with batch 4 + grad checkpoint
learning_rate = 1.5e-4
unet_lr = 1.5e-4
text_encoder_lr = 1.0e-4       # stronger TE so the `soyjak` token actually binds
lr_scheduler = "cosine_with_restarts"
lr_warmup_steps = 360          # ~2% of max_train_steps
max_train_steps = 18000        # ~2.7 epochs at effective batch 16; style lock needs more than 1.8
train_batch_size = 4           # must match BATCH_SIZE in train_lora.sh
gradient_accumulation_steps = 4  # effective batch 16; must match GRAD_ACCUM_STEPS
max_grad_norm = 1.0
seed = 42

# --- SDXL specifics ---
no_half_vae = true             # avoid fp16 VAE NaNs
min_snr_gamma = 5              # stabilizes loss across noise levels

# --- logging / samples ---
logging_dir = "/home/ubuntu/logs"
log_with = "tensorboard"
sample_every_n_steps = 1500
sample_sampler = "euler_a"
# Sample prompts always include the `soyjak` trigger. Edit sample_prompts.txt to taste.
sample_prompts = "/home/ubuntu/sample_prompts.txt"
