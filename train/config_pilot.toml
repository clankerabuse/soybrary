# config_pilot.toml - SDXL FULL fine-tune PILOT args for kohya sd-scripts.
#
# Small first run: ~10k stratified images. Validates domain takeover
# (soyjak subject + class hijack, extra objects still appear) before the
# ~105k run. Expect roughly 2-4 hrs on 1× A100 including latent cache.
#
# Effective batch = 2 × 8 = 16. ~10,000 / 16 = ~625 steps per epoch.
# max_train_steps = 1500 is ~2.4 epochs.
#
# IMPORTANT: train_batch_size / gradient_accumulation_steps must match
# BATCH_SIZE / GRAD_ACCUM_STEPS in train_lora.sh. Full run uses config.toml.

pretrained_model_name_or_path = "/home/ubuntu/models/sd_xl_base_1.0_fixvae_fp16.safetensors"

output_dir = "/home/ubuntu/out"
output_name = "soyjak-sdxl-ft-pilot"
save_model_as = "safetensors"
save_precision = "bf16"
save_every_n_steps = 500
save_last_n_steps = 1500

mixed_precision = "bf16"
full_bf16 = true
gradient_checkpointing = true
sdpa = true
fused_backward_pass = true
cache_latents = true
cache_latents_to_disk = true
persistent_data_loader_workers = true
max_data_loader_n_workers = 8

optimizer_type = "adafactor"
optimizer_args = ["scale_parameter=False", "relative_step=False", "warmup_init=False"]
learning_rate = 1e-5
learning_rate_te1 = 5e-6
learning_rate_te2 = 5e-6
train_text_encoder = true
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 50
max_train_steps = 1500
train_batch_size = 2
gradient_accumulation_steps = 8
max_grad_norm = 1.0
seed = 42

no_half_vae = true
min_snr_gamma = 5

logging_dir = "/home/ubuntu/logs"
log_with = "tensorboard"
sample_every_n_steps = 500
sample_sampler = "euler_a"
sample_prompts = "/home/ubuntu/sample_prompts.txt"
