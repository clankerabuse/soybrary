# config.toml - SDXL FULL fine-tune args for kohya sd-scripts (sdxl_train.py).
# Passed via --config_file. The dataset is described separately in dataset.toml
# (generated by train_lora.sh) and passed via --dataset_config.
#
# This is domain takeover, not a LoRA. The UNet + both text encoders are
# trained so SDXL's prior becomes soyjaks. Extra objects/settings in a prompt
# are allowed; a soyjak-less image is not.
#
# Tuned for 1× A100 40GB.
# Effective batch = train_batch_size × gradient_accumulation_steps = 2 × 8 = 16.
# Step math: ~105,495 images / 16 = ~6,593 steps per epoch.
# 12k steps ≈ 1.8 epochs — enough to overwrite the prior without collapsing
# variant diversity. OOM? BATCH_SIZE=1 GRAD_ACCUM_STEPS=16.
#
# IMPORTANT: train_batch_size must match BATCH_SIZE in train_lora.sh.
# Do NOT add regularization/class images. Do NOT set `vae = ""`.

# --- base model ---
pretrained_model_name_or_path = "/home/ubuntu/models/sd_xl_base_1.0_fixvae_fp16.safetensors"

# --- output ---
# Full SDXL checkpoints are ~6.5 GB each. Keep only recent ones.
output_dir = "/home/ubuntu/out"
output_name = "soyjak-sdxl-ft"
save_model_as = "safetensors"
save_precision = "bf16"
save_every_n_steps = 3000
save_last_n_steps = 6000

# --- precision / memory (1× A100 40GB) ---
mixed_precision = "bf16"
full_bf16 = true
gradient_checkpointing = true
sdpa = true
fused_backward_pass = true     # Adafactor fused backward; needed to fit batch 2
cache_latents = true
cache_latents_to_disk = true
persistent_data_loader_workers = true
max_data_loader_n_workers = 8

# --- optimizer / schedule ---
# Adafactor is the kohya SDXL full-FT recipe (AdamW states of the full UNet
# will not fit comfortably next to activations). LR is ~10× lower than LoRA.
optimizer_type = "adafactor"
optimizer_args = ["scale_parameter=False", "relative_step=False", "warmup_init=False"]
learning_rate = 1e-5
learning_rate_te1 = 5e-6
learning_rate_te2 = 5e-6
train_text_encoder = true
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 240          # ~2% of max_train_steps
max_train_steps = 12000        # ~1.8 epochs at effective batch 16
train_batch_size = 2           # must match BATCH_SIZE in train_lora.sh
gradient_accumulation_steps = 8  # effective batch 16; must match GRAD_ACCUM_STEPS
max_grad_norm = 1.0
seed = 42

# --- SDXL specifics ---
no_half_vae = true
min_snr_gamma = 5

# --- logging / samples ---
logging_dir = "/home/ubuntu/logs"
log_with = "tensorboard"
sample_every_n_steps = 1500
sample_sampler = "euler_a"
sample_prompts = "/home/ubuntu/sample_prompts.txt"
